<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>News Feed</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div class="header">
        <h1>Стрічка новин ⚡</h1>
        <span class="date" id="current-date">...</span>
    </div>

    <div id="news-feed" class="news-container">
        </div>

    <div id="news-modal" class="modal-wrapper">
        <div class="modal-backdrop" onclick="closeModal()"></div>
        
        <div class="modal-sheet">
            <div class="drag-handle" onclick="closeModal()"></div>
            
            <div class="modal-content">
                <div class="modal-header-info">
                    <span id="modal-date" class="news-date">...</span>
                </div>
                <h2 id="modal-title">Заголовок</h2>

                <div id="telegram-widget-container"></div>

                <a href="#" id="modal-link" target="_blank" class="read-more-btn">
                    Відкрити в каналі ✈️
                </a>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
