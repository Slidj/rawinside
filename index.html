<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>INSIDE</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div class="header">
        <h1>INSIDE</h1>
    </div>

    <div id="news-feed" class="news-container"></div>
    
    <div id="scroll-guard" style="height: 20px; margin-bottom: 20px;"></div>

    <div id="news-modal" class="modal-wrapper">
        <div class="modal-sheet">
            <button class="close-btn" onclick="closeModal()">✕</button>
            
            <div class="modal-content">
                <div id="media-container" class="media-wrapper"></div>
                <div class="text-content">
                    <h2 id="modal-title">...</h2>
                    <span id="modal-date" class="news-date">...</span>
                    <p id="modal-text" class="full-text">...</p>
                    <a href="#" id="modal-link" target="_blank" class="app-btn">Відкрити джерело ↗</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
